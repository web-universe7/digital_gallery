<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Gallery</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated flowers + butterflies (drawn by garden.js) -->
  <canvas id="garden" aria-hidden="true"></canvas>

  <!-- Theme switch (Day garden / Night garden) -->
  <button id="themeBtn" class="theme-btn" type="button" aria-label="Switch theme">
    <span id="themeIcon" aria-hidden="true">🌙</span>
    <span id="themeLabel">Night garden</span>
  </button>

  <!-- Password screen -->
  <section id="lock">
    <div class="lock-box" id="lockBox">
      <h1>Private Gallery</h1>
      <p class="sub">Enter the password to view the photos</p>

      <div class="pw-row">
        <input type="password" id="pw" placeholder="Password" autocomplete="off" aria-label="Password">
        <button type="button" id="showPw" class="ghost" aria-label="Show password">Show</button>
      </div>
      <button type="button" id="enter" class="primary">Enter</button>
      <p id="error" role="alert"></p>
    </div>
  </section>

  <!-- Gallery (hidden until unlocked) -->
  <main id="gallery" class="hidden">
    <header class="top">
      <h1>Our Gallery</h1>
      <p class="sub">Tap any photo to see it full size</p>
      <button type="button" id="lockAgain" class="ghost">Lock gallery</button>
    </header>
    <div id="grid"></div>
    <p id="empty" class="hidden">No photos yet. Add file names to the PHOTOS list in script.js.</p>
  </main>

  <!-- Footer with contact number -->
  <footer id="footer">
    <div class="foot-card">
      <span>Contact</span>
      <a href="tel:+917745036055">7745036055</a>
    </div>
  </footer>

  <!-- Full-screen photo viewer -->
  <div id="viewer" class="hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <a id="vdl" class="v-btn" href="#" download aria-label="Download photo">&#8681;</a>
    <button id="vclose" class="v-btn" type="button" aria-label="Close">&times;</button>
    <button id="vprev" class="v-btn" type="button" aria-label="Previous photo">&#10094;</button>
    <img id="big" src="" alt="">
    <button id="vnext" class="v-btn" type="button" aria-label="Next photo">&#10095;</button>
    <div id="vinfo"><span id="vcap"></span><span id="vcount"></span></div>
  </div>

  <!-- Floating WhatsApp button -->
  <a class="wa-float" href="https://wa.me/917745036055?text=Hi%2C%20I%20saw%20your%20gallery"
     target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
      <path fill="#fff" d="M16.04 3C9.4 3 4 8.38 4 15.01c0 2.12.55 4.18 1.6 6L4 29l8.2-1.56a12.03 12.03 0 0 0 3.84.62h.01C22.68 28.06 28 22.68 28 16.05 28 9.4 22.68 3 16.04 3zm0 22.04h-.01c-1.18 0-2.34-.32-3.35-.92l-.24-.14-4.87.93.95-4.74-.16-.25a9.97 9.97 0 0 1-1.54-5.3c0-5.5 4.5-9.98 10.03-9.98 5.52 0 10 4.48 10 9.99 0 5.5-4.48 10.41-10.81 10.41zm5.5-7.48c-.3-.15-1.78-.88-2.06-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.95 1.18-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.67-2.08-.18-.3-.02-.46.13-.6.14-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.68-1.64-.93-2.25-.24-.58-.5-.5-.68-.5h-.58c-.2 0-.53.08-.8.38-.28.3-1.05 1.03-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.12 3.23 5.13 4.53.72.3 1.28.5 1.72.64.72.23 1.37.2 1.89.12.58-.09 1.78-.73 2.03-1.43.25-.7.25-1.3.18-1.43-.08-.12-.28-.2-.58-.35z"/>
    </svg>
  </a>

  <script src="garden.js"></script>
  <script src="script.js"></script>
</body>
</html>
